<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https://tigjhpjodvryosazwmqh.supabase.co; img-src 'self' data:; base-uri 'none'; frame-src 'self'; form-action 'none'">
<title>Garmin Marathon Coach — Accesso</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1422;color:#e9f1fa}.panel{box-sizing:border-box;width:min(440px,calc(100vw - 32px));background:#14243a;border:1px solid #29405b;border-radius:18px;padding:32px}h1{font-size:1.65rem;margin:0 0 8px}p{color:#b8c8d9;line-height:1.5}label{display:block;margin:22px 0 8px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:9px}input{background:#0b1422;color:white;border:1px solid #59718b}button{background:#5bb7e8;color:#071522;border:0;margin-top:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.secondary{background:transparent;color:#d9e9fa;border:1px solid #59718b}.note{font-size:.9rem}#status{min-height:1.5em} body.logged-in .panel{width:min(1200px,calc(100vw - 24px));padding:20px}#dashboard{width:100%;height:75vh;min-height:520px;border:1px solid #29405b;border-radius:10px;background:white}#logout{max-width:180px} [hidden]{display:none!important}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script>
<script defer src="./app.js"></script>
</head>
<body><main class="panel">
<h1>Garmin Marathon Coach</h1>
<p>Accesso personale al cruscotto di allenamento.</p>
<section id="login"><form id="loginForm"><label for="email">Indirizzo email autorizzato</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password (se già impostata)</label><input id="password" type="password" autocomplete="current-password" minlength="8"><button id="passwordLogin" type="button">Accedi con password</button><button id="send" class="secondary" type="submit">Invia link di accesso</button></form><p class="note">Riceverai un link monouso nella tua casella email.</p></section>
<section id="signedIn" hidden><p>Autenticazione riuscita.</p><p class="note">Cruscotto personale caricato da Supabase Storage privato.</p><button id="reload" class="secondary" type="button">Aggiorna cruscotto</button><iframe id="dashboard" title="Cruscotto Garmin privato" sandbox="" referrerpolicy="no-referrer" hidden></iframe><div id="passwordSetup"><label for="newPassword">Imposta o cambia password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" placeholder="Almeno 12 caratteri"><button id="setPassword" class="secondary" type="button">Salva password</button></div><button id="logout" class="secondary" type="button">Esci</button></section>
<p id="status" role="status" aria-live="polite"></p>
</main></body></html>
